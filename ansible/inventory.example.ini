# ============================================================
# Ansible Multi-Vendor Network Automation
# Example INI Inventory
#
# IMPORTANT:
# This is an example only.
# Do not put real credentials in this file.
#
# The primary v1.2 inventory is:
#     ansible/inventory/hosts.yml
# ============================================================


[mikrotik]
mikrotik-01 ansible_host=YOUR_PUBLIC_IP ansible_port=2222


[mikrotik:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=community.routeros.routeros
ansible_user=YOUR_ROUTER_USER
ansible_password=YOUR_ROUTER_PASSWORD
ansible_network_cli_ssh_type=libssh
ansible_ssh_common_args='-o PreferredAuthentications=password -o PubkeyAuthentication=no'


[cisco]
cisco-01 ansible_host=192.168.174.200 ansible_port=22


[cisco:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_user=YOUR_CISCO_USER
ansible_password=YOUR_CISCO_PASSWORD
ansible_network_cli_ssh_type=libssh
ansible_ssh_common_args='-o KexAlgorithms=+diffie-hellman-group14-sha1 -o HostKeyAlgorithms=+ssh-rsa'


[fortigate]
fortigate-01 ansible_host=192.168.203.2 ansible_port=443


[fortigate:vars]
ansible_connection=ansible.netcommon.httpapi
ansible_network_os=fortinet.fortios.fortios
ansible_user=YOUR_FORTIGATE_USER
ansible_password=YOUR_FORTIGATE_PASSWORD
ansible_httpapi_use_ssl=true
ansible_httpapi_validate_certs=false
ansible_httpapi_port=443
vdom=root