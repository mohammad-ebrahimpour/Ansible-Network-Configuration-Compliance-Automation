---
- name: Common Compliance - Cisco IOS
  hosts: cisco
  gather_facts: false

  tasks:
    - name: Read Cisco SSH status
      cisco.ios.ios_command:
        commands:
          - show ip ssh
      register: ssh_status
      changed_when: false

    - name: Evaluate Cisco SSH
      ansible.builtin.set_fact:
        ssh_enabled: >-
          {{
            'SSH Enabled'
            in ssh_status.stdout[0]
          }}

        ssh_version_2: >-
          {{
            'SSH Enabled - version 2.0'
            in ssh_status.stdout[0]
          }}

    - name: Build Cisco control results
      ansible.builtin.set_fact:
        cisco_controls:
          - id: "CISCO-SSH-001"
            name: "SSH Enabled"
            desired: true
            actual: "{{ ssh_enabled }}"
            status: >-
              {{
                'COMPLIANT'
                if ssh_enabled
                else 'DRIFT'
              }}

          - id: "CISCO-SSH-002"
            name: "SSH Version 2"
            desired: "2"
            actual: >-
              {{
                '2'
                if ssh_version_2
                else 'UNKNOWN'
              }}
            status: >-
              {{
                'COMPLIANT'
                if ssh_version_2
                else 'DRIFT'
              }}

    - name: Calculate Cisco overall compliance
      ansible.builtin.set_fact:
        cisco_compliance_status: >-
          {{
            'COMPLIANT'
            if (
              ssh_enabled
              and
              ssh_version_2
            )
            else 'DRIFT'
          }}

    - name: Build common compliance result
      ansible.builtin.set_fact:
        common_compliance_result:
          device: "{{ inventory_hostname }}"
          vendor: "Cisco"
          platform: "IOS"
          status: "{{ cisco_compliance_status }}"
          controls: "{{ cisco_controls }}"

    - name: Report common compliance result
      ansible.builtin.debug:
        var: common_compliance_result

    - name: Validate common compliance schema
      ansible.builtin.assert:
        that:
          - common_compliance_result.device is defined
          - common_compliance_result.vendor is defined
          - common_compliance_result.platform is defined
          - common_compliance_result.status is defined
          - common_compliance_result.controls is defined
        fail_msg: "Invalid common compliance result."
        success_msg: "Cisco common compliance result is valid."
